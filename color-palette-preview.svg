<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220">
  <rect width="520" height="220" fill="#1e1e1e"/>

  <!-- Primary accent swatch -->
  <rect x="20" y="20" width="220" height="80" rx="8" fill="#6fe36b"/>
  <text x="30" y="70" font-family="Segoe UI, sans-serif" font-size="18" fill="#1e1e1e" font-weight="600">Primary — H1 / H2</text>
  <text x="30" y="120" font-family="Segoe UI, sans-serif" font-size="16" fill="#6fe36b">#6fe36b</text>

  <!-- Secondary accent swatch -->
  <rect x="280" y="20" width="220" height="80" rx="8" fill="#7aa7d9"/>
  <text x="290" y="70" font-family="Segoe UI, sans-serif" font-size="18" fill="#1e1e1e" font-weight="600">Secondary — H3 / H4</text>
  <text x="290" y="120" font-family="Segoe UI, sans-serif" font-size="16" fill="#7aa7d9">#7aa7d9</text>

  <!-- Sample heading text on dark background, as it appears in-app -->
  <text x="20" y="160" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#6fe36b"># Welcome</text>
  <text x="20" y="195" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#7aa7d9">### Java</text>
</svg>
